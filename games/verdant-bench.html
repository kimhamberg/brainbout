<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Brainbout — Propagation Bench (Phase 3)</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: linear-gradient(to bottom, #292c3c 0%, #2c3a2e 72%, #3a3326 100%);
        color: #c6d0f5;
        font-family: system-ui, sans-serif;
      }
      #bench {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      #stage {
        image-rendering: pixelated;
        transform: scale(2);
        transform-origin: top center;
        margin-bottom: 230px;
        border-radius: 4px;
        overflow: hidden;
        box-shadow: 0 8px 40px #0006;
      }
      #stage canvas {
        display: block;
        image-rendering: pixelated;
      }
      #bench-cue {
        font-size: 14px;
        max-width: 420px;
        text-align: center;
        opacity: 0.85;
      }
      .bench-btns {
        display: flex;
        gap: 10px;
      }
      .bench-btns button {
        padding: 8px 22px;
        border-radius: 8px;
        border: 0;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        color: #232634;
      }
      #bench-same {
        background: #a6d189;
      }
      #bench-moved {
        background: #e5c890;
      }
      #bench-same:disabled,
      #bench-moved:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #bench-reveal {
        min-height: 22px;
        font-size: 14px;
        cursor: pointer;
      }
      #bench-next {
        font-size: 12px;
        background: #51576d;
        color: #c6d0f5;
        border: 0;
        border-radius: 6px;
        padding: 4px 12px;
        cursor: pointer;
      }
      #bench-progress {
        font-size: 12px;
        opacity: 0.6;
      }
      #bench-summary {
        font-size: 14px;
        color: #a6d189;
      }
    </style>
  </head>
  <body>
    <div id="bench">
      <div id="stage"></div>
      <div id="bench-cue">a cutting is on the bench…</div>
      <div class="bench-btns">
        <button id="bench-same" type="button" disabled>Same plant</button>
        <button id="bench-moved" type="button" disabled>Moved</button>
      </div>
      <div id="bench-reveal"></div>
      <button id="bench-next" type="button">Next</button>
      <div id="bench-progress"></div>
    </div>
    <div id="bench-summary"></div>
    <script type="module" src="/src/scene/bench-demo.ts"></script>
  </body>
</html>
