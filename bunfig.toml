[test]
preload = ["./test/setup.ts"]
coverageReporter = ["text", "lcov"]
coverageThreshold = { lines = 0.99, functions = 1.0, statements = 0.99 }
coveragePathIgnorePatterns = [
  "src/hub.entry.ts",
  "src/games/crown.ts",
  "src/games/flux.ts",
  "src/games/lex.ts",
  "src/games/crown-block.ts",
  "src/games/flux-block.ts",
  "src/games/lex-block.ts",
  "src/engine/block.ts",
  "tools/stryke/harness.ts",
  "tools/stryke/instrument.ts",
  "tools/stryke/mutators.ts",
  "tools/stryke/runner.ts",
  "tools/stryke/types.ts",
]
